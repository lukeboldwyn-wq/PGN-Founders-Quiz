<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGN Founders Quiz</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  overflow: hidden;
}

.quiz {
  background: white;
  padding: 40px;
  border-radius: 16px;
  box-shadow: 0 4px 18px rgba(0,0,0,.15);
  text-align: center;
  width: 440px;
  max-width: 92%;
  position: relative;
  z-index: 5;
}

h1 { margin-top: 0; }

.progress-text {
  font-size: 20px;
  font-weight: bold;
  margin: 25px 0 10px;
}

.progress-bar {
  width: 100%;
  height: 18px;
  background: #ddd;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 20px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #4CAF50;
  transition: width .4s;
}

input {
  width: 100%;
  padding: 13px;
  font-size: 18px;
  margin: 12px 0;
  border: 1px solid #aaa;
  border-radius: 7px;
}

button {
  padding: 12px 22px;
  font-size: 16px;
  cursor: pointer;
  border: none;
  border-radius: 7px;
}

.submit-btn {
  background: #222;
  color: white;
}

.reset-btn {
  background: #ddd;
  margin-top: 20px;
}

#feedback {
  font-size: 18px;
  font-weight: bold;
  min-height: 25px;
  margin: 18px 0;
}

.completed-list {
  text-align: left;
  background: #f7f7f7;
  padding: 15px 20px;
  border-radius: 10px;
}

.completed-list h3 {
  text-align: center;
  margin-top: 0;
}

#completedNames {
  line-height: 1.9;
}

/* =========================
   FINAL CELEBRATION
========================= */

#celebration {
  display: none;
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle, #311b92 0%, #090016 55%, #000 100%);
  z-index: 100;
  overflow: hidden;
}

.celebration-text {
  position: absolute;
  z-index: 500;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: white;
  width: 90%;
  animation: megaPop .8s ease;
}

.celebration-text h1 {
  font-size: clamp(55px, 10vw, 110px);
  margin: 0;
  text-shadow:
    0 0 10px white,
    0 0 30px gold,
    0 0 60px orange;
}

.celebration-text h2 {
  font-size: clamp(28px, 5vw, 55px);
  margin: 10px;
}

.celebration-text p {
  font-size: 23px;
}

.play-again {
  font-size: 19px;
  background: white;
  margin-top: 15px;
}

/* =========================
   CONFETTI
========================= */

.confetti {
  position: fixed;
  width: 11px;
  height: 17px;
  z-index: 300;
  pointer-events: none;
}

@keyframes confettiFall {
  from {
    transform: translateY(-10vh) rotate(0deg);
  }
  to {
    transform: translateY(115vh) rotate(1200deg);
  }
}

@keyframes cannonLeft {
  0% {
    transform: translate(0,0) rotate(0);
  }
  100% {
    transform:
      translate(var(--x), var(--y))
      rotate(1200deg);
  }
}

@keyframes cannonRight {
  0% {
    transform: translate(0,0) rotate(0);
  }
  100% {
    transform:
      translate(var(--x), var(--y))
      rotate(-1200deg);
  }
}

/* =========================
   BALLOONS
========================= */

.balloon {
  position: fixed;
  bottom: -150px;
  width: 55px;
  height: 70px;
  border-radius: 50%;
  z-index: 200;
  opacity: .9;
  animation: balloonRise linear forwards;
}

.balloon::after {
  content: "";
  position: absolute;
  width: 1px;
  height: 80px;
  background: rgba(255,255,255,.7);
  left: 50%;
  top: 70px;
}

@keyframes balloonRise {
  0% {
    transform: translateY(0) translateX(0) rotate(-5deg);
  }
  50% {
    transform: translateY(-60vh) translateX(40px) rotate(5deg);
  }
  100% {
    transform: translateY(-130vh) translateX(-30px) rotate(-5deg);
  }
}

/* =========================
   FIREWORKS
========================= */

.fireworkParticle {
  position: fixed;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  z-index: 250;
  pointer-events: none;
  animation: explode 1.4s ease-out forwards;
}

@keyframes explode {
  from {
    transform: translate(0,0);
    opacity: 1;
  }
  to {
    transform: translate(var(--x),var(--y));
    opacity: 0;
  }
}

/* =========================
   CANNONS
========================= */

.cannon {
  position: fixed;
  bottom: -10px;
  font-size: 85px;
  z-index: 220;
  filter: drop-shadow(0 0 15px white);
}

.cannon.left {
  left: 15px;
  transform: rotate(-25deg);
}

.cannon.right {
  right: 15px;
  transform: scaleX(-1) rotate(-25deg);
}

/* =========================
   SCREEN FLASH
========================= */

.flash {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  z-index: 190;
  pointer-events: none;
  animation: flash .35s;
}

@keyframes flash {
  0% { opacity: 0; }
  40% { opacity: .65; }
  100% { opacity: 0; }
}

@keyframes megaPop {
  0% {
    transform: translate(-50%,-50%) scale(.1) rotate(-10deg);
    opacity: 0;
  }
  70% {
    transform: translate(-50%,-50%) scale(1.15) rotate(2deg);
  }
  100% {
    transform: translate(-50%,-50%) scale(1);
    opacity: 1;
  }
}

</style>
</head>

<body>

<div class="quiz">

<h1>PGN Founders Quiz</h1>

<p>Enter all 6 PGN founders.</p>
<p><strong>Perfect spelling required.</strong></p>

<div class="progress-text">
Progress: <span id="progress">0</span> / 6
</div>

<div class="progress-bar">
<div class="progress-fill" id="progressFill"></div>
</div>

<input
id="answer"
type="text"
placeholder="Enter founder's full name"
autocomplete="off">

<br>

<button class="submit-btn" onclick="checkAnswer()">
Submit
</button>

<div id="feedback"></div>

<div class="completed-list">
<h3>Founders Completed</h3>
<div id="completedNames">None yet</div>
</div>

<button class="reset-btn" onclick="resetQuiz()">
Reset Quiz
</button>

</div>


<!-- FINAL CELEBRATION -->

<div id="celebration">

<div class="cannon left">💥</div>
<div class="cannon right">💥</div>

<div class="celebration-text">

<h1>🎉 6 / 6 🎉</h1>

<h2>YOU KNOW ALL THE FOUNDERS!</h2>

<p>PNM QUIZ LOCKED IN.</p>

<button class="play-again" onclick="resetQuiz()">
Run It Back
</button>

</div>

</div>


<script>

const founders = [
"Celeste Weyl",
"Elizabeth Conroy Fleming",
"Helen Vogel Purcell",
"Marge McInerney Hawes",
"Mary Chard Nalbach",
"Sylvia Pekar Arnold"
];

let completed = [];
let celebrationIntervals = [];


/* =========================
   ANSWER CHECKING
========================= */

function checkAnswer() {

  const input = document.getElementById("answer");
  const answer = input.value;

  if (founders.includes(answer)) {

    if (completed.includes(answer)) {

      document.getElementById("feedback").innerHTML =
      "⚠️ You already got that founder!";

    } else {

      completed.push(answer);

      document.getElementById("feedback").innerHTML =
      "✅ Correct!";

      updateProgress();

      /* MINI CELEBRATION EVERY CORRECT ANSWER */
      miniConfetti();

    }

  } else {

    document.getElementById("feedback").innerHTML =
    "❌ Incorrect — check your spelling.";

  }

  input.value = "";
  input.focus();
}


/* =========================
   PROGRESS
========================= */

function updateProgress() {

  const progress = completed.length;

  document.getElementById("progress").innerText =
  progress;

  document.getElementById("progressFill").style.width =
  ((progress / 6) * 100) + "%";

  let list = "";

  completed.forEach(name => {
    list += "✓ " + name + "<br>";
  });

  document.getElementById("completedNames").innerHTML =
  list;

  if (progress === 6) {

    setTimeout(startMegaCelebration, 600);

  }
}


/* =========================
   MINI CONFETTI
   EACH CORRECT ANSWER
========================= */

function miniConfetti() {

  const colors = [
    "#ff1744",
    "#ffea00",
    "#00e676",
    "#2979ff",
    "#d500f9",
    "#ff9100"
  ];

  for (let i = 0; i < 45; i++) {

    const piece =
    document.createElement("div");

    piece.className = "confetti";

    piece.style.left =
    (45 + Math.random() * 10) + "vw";

    piece.style.top =
    "45vh";

    piece.style.background =
    colors[
      Math.floor(Math.random() * colors.length)
    ];

    piece.style.setProperty(
      "--x",
      (Math.random() * 500 - 250) + "px"
    );

    piece.style.setProperty(
      "--y",
      (Math.random() * 450 - 300) + "px"
    );

    piece.style.animation =
    "cannonLeft 1.4s ease-out forwards";

    document.body.appendChild(piece);

    setTimeout(() => piece.remove(), 1500);
  }
}


/* =========================
   MEGA CELEBRATION
========================= */

function startMegaCelebration() {

  document.getElementById("celebration").style.display =
  "block";

  screenFlash();

  /* MASSIVE INITIAL CANNONS */

  for (let i = 0; i < 5; i++) {

    setTimeout(() => {
      cannonBlast("left");
      cannonBlast("right");
    }, i * 300);

  }

  /* IMMEDIATE FIREWORKS */

  for (let i = 0; i < 10; i++) {

    setTimeout(() => {
      createFirework();
    }, i * 250);

  }

  /* BALLOON FLOOD */

  for (let i = 0; i < 35; i++) {

    setTimeout(() => {
      createBalloon();
    }, i * 120);

  }

  /* CONFETTI RAIN */

  celebrationIntervals.push(
    setInterval(confettiRain, 180)
  );

  /* RANDOM FIREWORKS */

  celebrationIntervals.push(
    setInterval(createFirework, 450)
  );

  /* MORE BALLOONS */

  celebrationIntervals.push(
    setInterval(createBalloon, 500)
  );

  /* REPEATED CANNONS */

  celebrationIntervals.push(
    setInterval(() => {

      cannonBlast("left");
      cannonBlast("right");

    }, 1500)
  );

}


/* =========================
   CONFETTI RAIN
========================= */

function confettiRain() {

  const colors = [
    "#ff1744",
    "#ffea00",
    "#00e676",
    "#2979ff",
    "#d500f9",
    "#ff9100",
    "#ffffff"
  ];

  for (let i = 0; i < 15; i++) {

    const piece =
    document.createElement("div");

    piece.className = "confetti";

    piece.style.left =
    Math.random() * 100 + "vw";

    piece.style.top =
    "-30px";

    piece.style.background =
    colors[
      Math.floor(Math.random() * colors.length)
    ];

    piece.style.animation =
    "confettiFall " +
    (2 + Math.random() * 3) +
    "s linear forwards";

    document.body.appendChild(piece);

    setTimeout(() => piece.remove(), 5200);
  }
}


/* =========================
   CONFETTI CANNONS
========================= */

function cannonBlast(side) {

  const colors = [
    "#ff1744",
    "#ffea00",
    "#00e676",
    "#2979ff",
    "#d500f9",
    "#ff9100",
    "#ffffff"
  ];

  screenFlash();

  for (let i = 0; i < 90; i++) {

    const piece =
    document.createElement("div");

    piece.className = "confetti";

    piece.style.bottom = "20px";

    piece.style.background =
    colors[
      Math.floor(Math.random() * colors.length)
    ];

    if (side === "left") {

      piece.style.left = "30px";

      piece.style.setProperty(
        "--x",
        (150 + Math.random() * 800) + "px"
      );

      piece.style.setProperty(
        "--y",
        (-150 - Math.random() * 700) + "px"
      );

      piece.style.animation =
      "cannonLeft 2.3s ease-out forwards";

    } else {

      piece.style.right = "30px";

      piece.style.setProperty(
        "--x",
        (-150 - Math.random() * 800) + "px"
      );

      piece.style.setProperty(
        "--y",
        (-150 - Math.random() * 700) + "px"
      );

      piece.style.animation =
      "cannonRight 2.3s ease-out forwards";
    }

    document.body.appendChild(piece);

    setTimeout(() => piece.remove(), 2500);
  }
}


/* =========================
   BALLOONS
========================= */

function createBalloon() {

  const colors = [
    "#ff1744",
    "#ffea00",
    "#00e676",
    "#2979ff",
    "#d500f9",
    "#ff9100",
    "#ff4081"
  ];

  const balloon =
  document.createElement("div");

  balloon.className = "balloon";

  balloon.style.left =
  Math.random() * 95 + "vw";

  balloon.style.background =
  colors[
    Math.floor(Math.random() * colors.length)
  ];

  balloon.style.animationDuration =
  (4 + Math.random() * 5) + "s";

  document.body.appendChild(balloon);

  setTimeout(() => balloon.remove(), 9000);
}


/* =========================
   FIREWORKS
========================= */

function createFirework() {

  const x =
  10 + Math.random() * 80;

  const y =
  10 + Math.random() * 60;

  const colors = [
    "#ff1744",
    "#ffea00",
    "#00e676",
    "#2979ff",
    "#d500f9",
    "#ff9100",
    "#ffffff"
  ];

  const color =
  colors[
    Math.floor(Math.random() * colors.length)
  ];

  for (let i = 0; i < 45; i++) {

    const particle =
    document.createElement("div");

    particle.className =
    "fireworkParticle";

    particle.style.left =
    x + "vw";

    particle.style.top =
    y + "vh";

    particle.style.background =
    color;

    const angle =
    Math.random() * Math.PI * 2;

    const distance =
    70 + Math.random() * 220;

    particle.style.setProperty(
      "--x",
      Math.cos(angle) * distance + "px"
    );

    particle.style.setProperty(
      "--y",
      Math.sin(angle) * distance + "px"
    );

    document.body.appendChild(particle);

    setTimeout(
      () => particle.remove(),
      1500
    );
  }
}


/* =========================
   FLASH EFFECT
========================= */

function screenFlash() {

  const flash =
  document.createElement("div");

  flash.className = "flash";

  document.body.appendChild(flash);

  setTimeout(() => flash.remove(), 400);
}


/* =========================
   RESET
========================= */

function resetQuiz() {

  completed = [];

  celebrationIntervals.forEach(clearInterval);
  celebrationIntervals = [];

  document.getElementById("progress").innerText =
  "0";

  document.getElementById("progressFill").style.width =
  "0%";

  document.getElementById("completedNames").innerHTML =
  "None yet";

  document.getElementById("feedback").innerHTML =
  "";

  document.getElementById("celebration").style.display =
  "none";

  document.querySelectorAll(
    ".confetti, .balloon, .fireworkParticle, .flash"
  ).forEach(element => element.remove());

  document.getElementById("answer").value =
  "";

  document.getElementById("answer").focus();
}


/* ENTER KEY */

document
.getElementById("answer")
.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    checkAnswer();
  }

});

document.getElementById("answer").focus();

</script>

</body>
</html>
