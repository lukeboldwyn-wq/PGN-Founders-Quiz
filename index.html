<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PGN Requirements Quiz</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    overflow: hidden;
}

.quiz {
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,.15);
    text-align: center;
    width: 600px;
    max-width: 94%;
    position: relative;
    z-index: 5;
}

h1 {
    margin-top: 0;
}

.progress-text {
    font-size: 20px;
    font-weight: bold;
    margin: 25px 0 10px;
}

.progress-bar {
    width: 100%;
    height: 18px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #4CAF50;
    transition: width .4s;
}

textarea {
    width: 100%;
    padding: 13px;
    font-size: 16px;
    margin: 12px 0;
    border: 1px solid #aaa;
    border-radius: 7px;
    resize: vertical;
    min-height: 85px;
    font-family: Arial, sans-serif;
}

button {
    padding: 12px 22px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 7px;
}

.submit-btn {
    background: #222;
    color: white;
}

.reset-btn {
    background: #ddd;
    margin-top: 20px;
}

#feedback {
    font-size: 18px;
    font-weight: bold;
    min-height: 25px;
    margin: 18px 0;
}

.completed-list {
    text-align: left;
    background: #f7f7f7;
    padding: 15px 20px;
    border-radius: 10px;
}

.completed-list h3 {
    text-align: center;
    margin-top: 0;
}

#completedItems {
    line-height: 1.6;
}

/* CONFETTI */

.confetti {
    position: fixed;
    width: 11px;
    height: 16px;
    z-index: 300;
    pointer-events: none;
}

@keyframes explode {
    from {
        transform: translate(0,0) rotate(0);
        opacity: 1;
    }

    to {
        transform:
            translate(var(--x),var(--y))
            rotate(1000deg);
        opacity: 0;
    }
}

@keyframes rain {
    from {
        transform: translateY(-10vh) rotate(0);
    }

    to {
        transform: translateY(115vh) rotate(1200deg);
    }
}

/* FINAL CELEBRATION */

#celebration {
    display: none;
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle, #311b92 0%, #090016 55%, #000 100%);
    z-index: 100;
    overflow: hidden;
}

.celebration-text {
    position: absolute;
    z-index: 500;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    color: white;
    text-align: center;
    width: 90%;
}

.celebration-text h1 {
    font-size: clamp(55px,10vw,110px);
    margin: 0;
    text-shadow:
        0 0 10px white,
        0 0 30px gold,
        0 0 60px orange;
}

.celebration-text h2 {
    font-size: clamp(25px,5vw,50px);
}

.play-again {
    background: white;
    font-size: 18px;
    margin-top: 20px;
}

/* BALLOONS */

.balloon {
    position: fixed;
    bottom: -100px;
    width: 55px;
    height: 70px;
    border-radius: 50%;
    z-index: 200;
    animation: balloonRise linear forwards;
}

.balloon::after {
    content: "";
    position: absolute;
    width: 1px;
    height: 80px;
    background: white;
    left: 50%;
    top: 70px;
}

@keyframes balloonRise {

    from {
        transform: translateY(0);
    }

    to {
        transform:
            translateY(-130vh)
            translateX(var(--drift));
    }

}

</style>
</head>


<body>

<div class="quiz">

<h1>PGN Requirements Quiz</h1>

<p>Enter all 4 requirements.</p>

<p>
<strong>Perfect spelling and wording required.</strong>
</p>

<div class="progress-text">

Progress:
<span id="progress">0</span> / 4

</div>

<div class="progress-bar">

<div
class="progress-fill"
id="progressFill">
</div>

</div>

<textarea
id="answer"
placeholder="Type one complete requirement here..."
autocomplete="off">
</textarea>

<br>

<button
class="submit-btn"
onclick="checkAnswer()">

Submit

</button>

<div id="feedback"></div>


<div class="completed-list">

<h3>Requirements Completed</h3>

<div id="completedItems">
None yet
</div>

</div>


<button
class="reset-btn"
onclick="resetQuiz()">

Reset Quiz

</button>

</div>


<!-- FINAL CELEBRATION -->

<div id="celebration">

<div class="celebration-text">

<h1>🎉 4 / 4 🎉</h1>

<h2>ALL REQUIREMENTS COMPLETE!</h2>

<p>PNM QUIZ LOCKED IN.</p>

<button
class="play-again"
onclick="resetQuiz()">

Run It Back

</button>

</div>

</div>


<script>

/* EXACT ACCEPTED ANSWERS */

const requirements = [

"To have a voice in the business and programs of our chapter",

"To be kept informed of chapter activities and messages from the National Fraternity",

"To be represented and guided by competent leaders",

"To express opinions, make suggestions and offer constructive criticism"

];


let completed = [];

let celebrationInterval;


/* CHECK ANSWER */

function checkAnswer() {

    const input =
        document.getElementById("answer");

    const answer =
        input.value.trim();


    if (requirements.includes(answer)) {

        if (completed.includes(answer)) {

            document.getElementById("feedback").innerHTML =
                "⚠️ You already got that requirement!";

        }

        else {

            completed.push(answer);

            document.getElementById("feedback").innerHTML =
                "✅ Correct!";

            miniConfetti();

            updateProgress();

        }

    }

    else {

        document.getElementById("feedback").innerHTML =
            "❌ Incorrect — wording or spelling isn't exact.";

    }


    input.value = "";

    input.focus();

}


/* UPDATE PROGRESS */

function updateProgress() {

    const progress =
        completed.length;


    document.getElementById("progress").innerText =
        progress;


    document.getElementById("progressFill").style.width =
        ((progress / 4) * 100) + "%";


    let list = "";


    completed.forEach(function(item) {

        list +=
            "✓ " +
            item +
            "<br><br>";

    });


    document.getElementById("completedItems").innerHTML =
        list;


    if (progress === 4) {

        setTimeout(
            startCelebration,
            600
        );

    }

}


/* SMALL CONFETTI FOR EACH RIGHT ANSWER */

function miniConfetti() {

    const colors = [
        "#ff1744",
        "#ffea00",
        "#00e676",
        "#2979ff",
        "#d500f9",
        "#ff9100"
    ];


    for (let i = 0; i < 55; i++) {

        const piece =
            document.createElement("div");

        piece.className =
            "confetti";


        piece.style.left =
            "50vw";

        piece.style.top =
            "50vh";


        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        piece.style.setProperty(
            "--x",
            (Math.random() * 600 - 300) +
            "px"
        );


        piece.style.setProperty(
            "--y",
            (Math.random() * 500 - 300) +
            "px"
        );


        piece.style.animation =
            "explode 1.5s ease-out forwards";


        document.body.appendChild(piece);


        setTimeout(
            () => piece.remove(),
            1600
        );

    }

}


/* FINAL CELEBRATION */

function startCelebration() {

    document.getElementById("celebration").style.display =
        "block";


    /* HUGE INITIAL CONFETTI */

    for (let i = 0; i < 8; i++) {

        setTimeout(
            megaBlast,
            i * 250
        );

    }


    /* BALLOONS */

    for (let i = 0; i < 40; i++) {

        setTimeout(
            createBalloon,
            i * 100
        );

    }


    /* KEEP RAINING CONFETTI */

    celebrationInterval =
        setInterval(
            confettiRain,
            180
        );

}


/* GIANT CONFETTI BLAST */

function megaBlast() {

    const colors = [
        "#ff1744",
        "#ffea00",
        "#00e676",
        "#2979ff",
        "#d500f9",
        "#ff9100",
        "#ffffff"
    ];


    for (let i = 0; i < 120; i++) {

        const piece =
            document.createElement("div");

        piece.className =
            "confetti";


        piece.style.left =
            (Math.random() > .5)
            ? "0px"
            : "100vw";


        piece.style.top =
            (40 + Math.random() * 50) +
            "vh";


        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        piece.style.setProperty(
            "--x",
            (Math.random() * 1200 - 600) +
            "px"
        );


        piece.style.setProperty(
            "--y",
            (-200 - Math.random() * 700) +
            "px"
        );


        piece.style.animation =
            "explode 2.2s ease-out forwards";


        document.body.appendChild(piece);


        setTimeout(
            () => piece.remove(),
            2300
        );

    }

}


/* CONFETTI RAIN */

function confettiRain() {

    const colors = [
        "#ff1744",
        "#ffea00",
        "#00e676",
        "#2979ff",
        "#d500f9",
        "#ff9100",
        "#ffffff"
    ];


    for (let i = 0; i < 18; i++) {

        const piece =
            document.createElement("div");

        piece.className =
            "confetti";


        piece.style.left =
            Math.random() * 100 +
            "vw";


        piece.style.top =
            "-20px";


        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        piece.style.animation =
            "rain " +
            (2 + Math.random() * 3) +
            "s linear forwards";


        document.body.appendChild(piece);


        setTimeout(
            () => piece.remove(),
            5200
        );

    }

}


/* BALLOONS */

function createBalloon() {

    const colors = [
        "#ff1744",
        "#ffea00",
        "#00e676",
        "#2979ff",
        "#d500f9",
        "#ff9100",
        "#ff4081"
    ];


    const balloon =
        document.createElement("div");


    balloon.className =
        "balloon";


    balloon.style.left =
        Math.random() * 95 +
        "vw";


    balloon.style.background =
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];


    balloon.style.setProperty(
        "--drift",
        (Math.random() * 200 - 100) +
        "px"
    );


    balloon.style.animationDuration =
        (4 + Math.random() * 4) +
        "s";


    document.body.appendChild(balloon);


    setTimeout(
        () => balloon.remove(),
        8500
    );

}


/* RESET */

function resetQuiz() {

    completed = [];


    clearInterval(
        celebrationInterval
    );


    document.getElementById("progress").innerText =
        "0";


    document.getElementById("progressFill").style.width =
        "0%";


    document.getElementById("completedItems").innerHTML =
        "None yet";


    document.getElementById("feedback").innerHTML =
        "";


    document.getElementById("celebration").style.display =
        "none";


    document.querySelectorAll(
        ".confetti, .balloon"
    ).forEach(
        element => element.remove()
    );


    document.getElementById("answer").value =
        "";


    document.getElementById("answer").focus();

}


/* CTRL + ENTER ALSO SUBMITS */

document
.getElementById("answer")
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            checkAnswer();

        }

    }
);


document
.getElementById("answer")
.focus();

</script>

</body>
</html>
