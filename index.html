<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PGN Founders Quiz</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .quiz {
      background: white;
      padding: 40px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      text-align: center;
      width: 430px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .progress-text {
      font-size: 20px;
      font-weight: bold;
      margin: 25px 0 10px;
    }

    .progress-bar {
      width: 100%;
      height: 18px;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #4CAF50;
      transition: width 0.3s;
    }

    input {
      width: 90%;
      padding: 12px;
      font-size: 18px;
      margin: 15px 0;
    }

    button {
      padding: 12px 22px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
    }

    .submit-btn {
      background: #222;
      color: white;
    }

    .reset-btn {
      background: #ddd;
      margin-top: 20px;
    }

    #feedback {
      font-size: 18px;
      font-weight: bold;
      margin: 20px 0;
      min-height: 22px;
    }

    .completed-list {
      text-align: left;
      margin-top: 25px;
    }

    .completed-list h3 {
      text-align: center;
    }

    #completedNames {
      line-height: 1.8;
    }
  </style>
</head>

<body>

<div class="quiz">

  <h1>PGN Founders Quiz</h1>

  <p>Enter all 6 PGN founders.</p>
  <p><strong>Perfect spelling required.</strong></p>

  <div class="progress-text">
    Progress: <span id="progress">0</span> / 6
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <input
    type="text"
    id="answer"
    placeholder="Enter founder's full name"
    autocomplete="off"
  >

  <br>

  <button class="submit-btn" onclick="checkAnswer()">
    Submit
  </button>

  <div id="feedback"></div>

  <div class="completed-list">
    <h3>Founders Completed</h3>
    <div id="completedNames">
      None yet
    </div>
  </div>

  <button class="reset-btn" onclick="resetQuiz()">
    Reset Quiz
  </button>

</div>


<script>

const founders = [
  "Celeste Weyl",
  "Elizabeth Conroy Fleming",
  "Helen Vogel Purcell",
  "Marge Mclnerney Hawes",
  "Mary Chard Nalbach",
  "Sylvia Pekar Arnold"
];

let completed = [];

function checkAnswer() {

  const input = document.getElementById("answer");
  const answer = input.value;

  // Correct founder
  if (founders.includes(answer)) {

    // Already entered
    if (completed.includes(answer)) {

      document.getElementById("feedback").innerHTML =
        "⚠️ You already got that founder!";

    } else {

      completed.push(answer);

      document.getElementById("feedback").innerHTML =
        "✅ Correct!";

      updateProgress();
    }

  } else {

    document.getElementById("feedback").innerHTML =
      "❌ Incorrect — check your spelling.";

  }

  input.value = "";
  input.focus();
}


function updateProgress() {

  const progress = completed.length;

  document.getElementById("progress").innerText = progress;

  const percent = (progress / founders.length) * 100;

  document.getElementById("progressFill").style.width =
    percent + "%";

  // Display completed founders
  let list = "";

  completed.forEach(function(name) {
    list += "✓ " + name + "<br>";
  });

  document.getElementById("completedNames").innerHTML = list;

  // Finished quiz
  if (progress === founders.length) {

    document.getElementById("feedback").innerHTML =
      "🎉 6/6 — You know all the founders!";

  }
}


function resetQuiz() {

  completed = [];

  document.getElementById("progress").innerText = "0";

  document.getElementById("progressFill").style.width = "0%";

  document.getElementById("completedNames").innerHTML =
    "None yet";

  document.getElementById("feedback").innerHTML = "";

  document.getElementById("answer").value = "";

  document.getElementById("answer").focus();
}


// Submit using Enter key
document.getElementById("answer").addEventListener(
  "keypress",
  function(event) {

    if (event.key === "Enter") {
      checkAnswer();
    }

  }
);

</script>

</body>
</html>
